name: Atualizar pontuações da liga

on:
  workflow_dispatch:
  schedule:
    # Todos os dias, a cada 30 minutos (UTC).
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt
      - name: Buscar API e gerar JSONs
        run: python scripts/compute.py --fetch
      - name: Publicar data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Sem mudanças"
          else
            git commit -m "Atualiza pontuações da Caneleiros Ligui"
            git push
          fi
